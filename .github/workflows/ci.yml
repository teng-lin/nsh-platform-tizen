name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    name: Rust tests, clippy, fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  page:
    name: Page runtime in headless Chrome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The TV build: Patina's pinned nightly with rust-src, std rebuilt for
      # MVP WebAssembly (build.sh). --stage skips Tizen packaging.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-24
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/tizen-wasm"
      - run: ./build.sh --stage
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci
        working-directory: tools
      # The runner's preinstalled Chrome.
      - run: node tools/page-test.mjs google-chrome
