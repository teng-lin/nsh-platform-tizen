[package]
name = "guide-spike"
description = "The Tizen platform's test app: a Patina-like guide over video."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nsh-core.workspace = true
nsh-platform-tizen = { path = "../nsh-platform-tizen" }
iptv-core.workspace = true
serde_json.workspace = true
# Ballast (feature `ballast`): real code a Patina module would also carry,
# to measure how compile and cached launches scale with module size.
nsh-base = { workspace = true, optional = true }
iptv-web = { path = "../../../patina-iptv/crates/iptv-web", optional = true }

[features]
ballast = ["ballast-core", "dep:nsh-base"]
ballast-core = ["dep:iptv-web"]
# Registers the font file NSH_APP_FONT (family NSH_APP_FONT_FAMILY) with
# Root::font: the app-font path through the text engine to the page.
app-font = []
