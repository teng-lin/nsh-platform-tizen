[package]
name = "sqlite-wasm-probe"
version = "0.0.1"
edition = "2024"
[lib]
crate-type = ["cdylib"]
[dependencies]
rusqlite = { version = "0.42", default-features = false, features = ["bundled", "ffi-sqlite-wasm-rs", "cache"] }
rsqlite-vfs = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
[workspace]
